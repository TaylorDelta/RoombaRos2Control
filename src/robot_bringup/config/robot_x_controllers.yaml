controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:              # delete entry if controller is not applicable
      type: forward_command_controller/ForwardCommandController

    forward_velocity_controller:              # delete entry if controller is not applicable
      type: forward_command_controller/ForwardCommandController

    joint_trajectory_controller:              # delete entry if controller is not applicable
      type: joint_trajectory_controller/JointTrajectoryController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    gpio_command_controller:
        type: gpio_controllers/GpioCommandController


diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.235
    wheel_radius: 0.036
    command_timeout: 0.5
    velocity_rolling_window_size: 2
    position_feedback: true
    open_loop: false
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 0.977

forward_position_controller:                  # delete entry if controller is not applicable
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint
    interface_name: position

forward_velocity_controller:                  # delete entry if controller is not applicable
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint

    interface_name: position

gpio_command_controller:
  ros__parameters:
    type: gpio_controllers/GpioCommandController

    gpios:
      - main_brush
      - side_brush
      - vacuum
      - mode

    command_interfaces:
      main_brush:
        - interfaces:
          - duty_cycle
      side_brush:
        - interfaces:
          - duty_cycle
      vacuum:
        - interfaces:
          - duty_cycle
      mode:
        - interfaces:
          - value

    state_interfaces:
      main_brush:
        - interfaces:
          - duty_cycle
      side_brush:
        - interfaces:
          - duty_cycle
      vacuum:
        - interfaces:
          - duty_cycle
      mode:
        - interfaces:
          - value


joint_trajectory_controller:                  # delete entry if controller is not applicable
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint



    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
      - acceleration

    state_publish_rate: 50.0 # Defaults to 50
    action_monitor_rate: 20.0 # Defaults to 20

    allow_partial_joints_goal: false # Defaults to false
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)


